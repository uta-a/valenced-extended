# valenced-extended: 実機で確認した pre-release を本番（Latest）にする。
# Manager は releases/latest を読むので、ここで初めて Manager に配られる。

name: "Release: Promote"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote (e.g. 1.3.0-ext.2). Empty = the newest pre-release
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  promote:
    name: Promote
    if: github.repository != 'Valenced/valenced'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | last | .tagName // empty')
            if [ -z "$TAG" ]; then
              echo "::error::No pre-release to promote."
              exit 1
            fi
          fi
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != true ]; then
            echo "::error::$TAG is not a pre-release."
            exit 1
          fi
          gh release edit "$TAG" --prerelease=false --latest
          echo "::notice::Promoted $TAG to the latest release"
